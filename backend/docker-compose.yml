# Быстрый запуск backend в Docker:
#   cp .env.example .env      # один раз; LM Studio и остальное — в .env
#   docker compose up -d --build
#   docker compose logs backend    # здесь при первом запуске будет пароль супер-админа
#
# База (./data) и первый пароль админа (./secrets) лежат рядом с кодом и переживают пересборку.
# Обе папки — в .gitignore. На Linux перед первым запуском: mkdir -p data secrets && sudo chown 10001:10001 data secrets

services:
  backend:
    build: .
    image: still-awake-backend:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Эти значения важнее .env: внутри контейнера свои адрес и пути.
      ADDR: 0.0.0.0:8080
      DB_PATH: /app/data/still-awake.db
      ADMIN_PASSWORD_FILE: /app/secrets/admin-password.txt
      FRONTEND_DIR: ""
      # 127.0.0.1 внутри контейнера — сам контейнер; LM Studio на хосте доступен как host.docker.internal.
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:1234}
      PROVIDER_ALLOWLIST: ${DOCKER_PROVIDER_ALLOWLIST:-http://host.docker.internal:1234}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
