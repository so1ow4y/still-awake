<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111218">
  <title>Still Awake? — панель</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Тема до загрузки стилей — без вспышки светлого экрана (ключ тот же, что в src/ui/prefs.js).
    try {
      var ui = JSON.parse(localStorage.getItem('sa.ui') || '{}');
      var theme = ui.theme || 'dark';
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      var scheme = ui.scheme || 'crimson';
      if (scheme !== 'indigo') document.documentElement.dataset.scheme = scheme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/panel.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div id="app"><div class="boot">Still Awake?…</div></div>
  <noscript>Для панели нужен JavaScript.</noscript>
</body>
</html>
